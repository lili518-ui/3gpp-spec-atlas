[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-mcp"
version = "0.1.0"
description = "Release-exact 3GPP clause locations from the 3GPP Spec Atlas, as a Python library and a local MCP server"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
atlas-mcp = "atlas_mcp.server:main"

[tool.setuptools]
packages = ["atlas_core", "atlas_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
